name: Custom macOS Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Check Swift formatting
        run: |
          brew list swiftformat >/dev/null 2>&1 || brew install swiftformat
          swiftformat --lint platforms/macos

      - name: Test shortcut expansion settings
        run: >-
          cargo test --manifest-path core/Cargo.toml
          --test shortcut_expansion_settings_test

      - name: Build Rust core
        run: |
          cargo build --manifest-path core/Cargo.toml --release \
            --target aarch64-apple-darwin
          cargo build --manifest-path core/Cargo.toml --release \
            --target x86_64-apple-darwin
          lipo -create \
            core/target/aarch64-apple-darwin/release/libgonhanh_core.a \
            core/target/x86_64-apple-darwin/release/libgonhanh_core.a \
            -output platforms/macos/libgonhanh_core.a

      - name: Build custom app
        run: |
          cd platforms/macos
          xcodebuild -scheme GoNhanh \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-"

          APP="build/Build/Products/Release/GoNhanh.app"
          GIT_TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          VERSION="${GIT_TAG#v}-custom"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :GoNhanhCustomBuild bool true" \
            "$APP/Contents/Info.plist"
          codesign --force --deep --sign - \
            --entitlements GoNhanh.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" build/GoNhanh-custom.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GoNhanh-custom-macOS
          path: platforms/macos/build/GoNhanh-custom.zip
          retention-days: 3
